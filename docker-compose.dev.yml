services:
  trackfolio-dev:
    image: node:22-alpine
    container_name: trackfolio_dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "6005:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    command: sh -c "npm install && npm run dev"

