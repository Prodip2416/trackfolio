services:
  trackfolio:
    build:
      context: .
      dockerfile: Dockerfile
      # Values come from .env (compose reads it for interpolation)
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
    container_name: trackfolio_app
    restart: unless-stopped
    ports:
      - "6005:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - trackfolio_network

networks:
  trackfolio_network:
    driver: bridge

